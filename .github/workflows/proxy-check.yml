name: Proxy model checks
on:
  push:
    branches: [feature/proxy-manager]
  pull_request:
jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate proxy profile model
        run: |
          mkdir -p /tmp/ult-proxy-classes
          javac -d /tmp/ult-proxy-classes proxy/src/com/yooshastan/ultmessenger/proxy/ProxyProfile.java proxy/tests/ProxyProfileTest.java
          java -cp /tmp/ult-proxy-classes ProxyProfileTest
