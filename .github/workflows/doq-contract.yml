name: Alpha 0.10f.4 DoQ and tracker policy contracts (no network transport)

on:
  push:
    branches: [feature/alpha10f3-doq-foundation, feature/alpha10f4-privacy-controls-spike]
    paths:
      - 'dns/**'
      - 'docs/ALPHA10F3_DOQ_FOUNDATION.md'
      - '.github/workflows/doq-contract.yml'
  pull_request:
    paths:
      - 'dns/**'
      - 'docs/ALPHA10F3_DOQ_FOUNDATION.md'
      - '.github/workflows/doq-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Endpoint validation and no-fallback contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile pure Java contract
        run: |
          mkdir -p /tmp/ult-doq-contract
          javac -d /tmp/ult-doq-contract \
            dns/src/com/yooshastan/ultmessenger/dns/UltDoqEndpoint.java \
            dns/src/com/yooshastan/ultmessenger/dns/UltDoqResolver.java \
            dns/src/com/yooshastan/ultmessenger/dns/UltDnsTrackerPolicy.java \
            dns/src/com/yooshastan/ultmessenger/dns/UltDoqBootstrap.java \
            dns/tests/UltDoqContractTest.java \
            dns/tests/UltDnsTrackerPolicyTest.java \
            dns/tests/UltDoqBootstrapTest.java
      - name: Run contract test (not proof of active DoQ)
        run: |
          java -cp /tmp/ult-doq-contract UltDoqContractTest
          java -cp /tmp/ult-doq-contract UltDnsTrackerPolicyTest
          java -cp /tmp/ult-doq-contract UltDoqBootstrapTest
