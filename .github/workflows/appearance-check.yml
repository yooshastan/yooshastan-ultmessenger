name: Appearance module checks
on:
  push:
    branches: [feature/nullgram-appearance]
  pull_request:
jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile appearance model and smoke test
        run: |
          mkdir -p /tmp/ult-appearance-classes
          javac -d /tmp/ult-appearance-classes appearance/src/com/yooshastan/ultmessenger/appearance/UltAppearancePreset.java appearance/tests/UltAppearancePresetTest.java
          java -cp /tmp/ult-appearance-classes UltAppearancePresetTest
      - name: Verify guarded upstream integration
        run: python3 -m unittest discover -s appearance/tests -p 'test_*.py' -v
