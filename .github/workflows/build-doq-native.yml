name: Alpha 0.10f.4 native DoQ engine build experiment

# This is an isolated toolchain experiment. The AAR is not bundled into Ultgram
# until ABI, licensing, dependencies and real DNS routing have been reviewed.
on:
  push:
    branches: [feature/alpha10f4-privacy-controls-spike]
    paths:
      - '.github/workflows/build-doq-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aar:
    name: Build pinned AdGuard DNS AAR (NOT app-integrated)
    # Pin the runner for reproducible GCC and Android build tool versions.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config make nasm gperf cmake git python3-pip
          python3 -m pip install --user --break-system-packages conan==2.33.0
          export PATH="$HOME/.local/bin:$PATH"
          conan profile detect --force
          cmake --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-34' 'ndk;29.0.14206865'
      - name: Fetch immutable Apache-2.0 DNS engine source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work
          git clone --depth 1 --branch v2.10.2 https://github.com/AdguardTeam/DnsLibs.git .work/dnslibs
          actual="$(git -C .work/dnslibs rev-parse HEAD)"
          expected=0c6e855b12eee2f696e7cc30719532fda4fdd512
          test "$actual" = "$expected" || { echo 'Pinned source mismatch'; exit 1; }
          test -f .work/dnslibs/LICENSE.md
      - name: Compile Android native AAR
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          dns_dir=.work/dnslibs/platform/android/dnsproxy
          cmake_bin="$(command -v cmake)"
          cmake_root="$(dirname "$(dirname "$cmake_bin")")"
          printf 'sdk.dir=%s\nndk.dir=%s\ncmake.dir=%s\n' \
            "$ANDROID_HOME" "$ANDROID_HOME/ndk/29.0.14206865" "$cmake_root" \
            > "$dns_dir/local.properties"
          cd "$dns_dir"
          ./gradlew :lib:assembleRelease --no-daemon --console=plain
      - name: Upload engine for ABI/security review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp .work/dnslibs/platform/android/dnsproxy/lib/build/outputs/aar/*.aar artifacts/
          sha256sum artifacts/*.aar
      - uses: actions/upload-artifact@v4
        with:
          name: ult-adguard-dnslibs-v2.10.2-unreviewed-aar
          path: artifacts/*.aar
          retention-days: 7
          if-no-files-found: error
