name: Verify Fedora local Ultgram builder
on:
  push:
    branches: [feature/auto-video-link-downloads]
    paths:
      - 'scripts/build-ultgram-local.py'
      - 'docs/LOCAL_FEDORA_BUILD.md'
      - '.github/workflows/local-fedora-builder-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python helper syntax and pinned build settings (no Android SDK needed)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build-ultgram-local.py
          python3 scripts/build-ultgram-local.py --help
          python3 scripts/build-ultgram-local.py status
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "local_builder", root / "scripts/build-ultgram-local.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert len(mod.INTEGRATORS) == 17, "Expected all pinned FOSS integrations"
          for name in mod.INTEGRATORS:
              assert (root / "scripts" / name).is_file(), name
          tag, code, version = mod.workflow_version()
          assert tag and code.isdecimal() and version, (tag, code, version)
          print("Pinned local builder metadata:", version, code)
          # Simulate a partially checked-out submodule without touching a checkout.
          import tempfile
          from unittest import mock
          with tempfile.TemporaryDirectory() as tmp:
              mod.SOURCE = Path(tmp)
              marker = mod.SOURCE / "TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle"
              calls = []
              module_dir = mod.SOURCE / "TMessagesProj/lib/jlatexmath"
              module_dir.mkdir(parents=True)
              (module_dir / ".git").write_text("gitdir: simulated")
              def fake_run(*args, **kwargs):
                  calls.append(args)
                  if "restore" in args:
                      marker.parent.mkdir(parents=True, exist_ok=True)
                      marker.write_text("apply plugin: 'com.android.library'")
              with mock.patch.object(mod, "run", fake_run):
                  mod.verify_jlatexmath_checkout()
                  assert marker.is_file(), "Missing tracked build.gradle not restored"
                  assert any(args[:3] == ("git", "-C", mod.SOURCE) for args in calls)
                  assert any("restore" in args for args in calls)
                  calls.clear()
                  mod.verify_jlatexmath_checkout()
                  assert calls == [], "An existing module must not be rechecked out"
          PY
