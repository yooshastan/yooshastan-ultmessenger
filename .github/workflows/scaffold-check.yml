name: Scaffold checks

on:
  push:
    branches: [main, develop, 'feature/**', 'research/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project scaffold
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/ARCHITECTURE.md
          test -s docs/FEATURE_MATRIX.md
          test -s docs/ALPHA_0_1.md
          grep -q 'Yooshastan ULT Messenger' docs/ARCHITECTURE.md
          echo 'Scaffold present. Android source build is not yet configured.'
      - name: Validate downloadable Android Studio bootstrap
        run: |
          bash -n scripts/prepare-android-studio.sh
          python3 -m py_compile scripts/integrate-appearance.py
          test -s docs/ANDROID_STUDIO.md
      - name: Test prototype configuration helper
        run: python3 -m unittest discover -s tests -v

      - name: Fast Alpha 0.11 network / chat / translation contract checks
        if: github.ref == 'refs/heads/feature/alpha11bc-batched' || github.head_ref == 'feature/alpha11bc-batched'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s proxy/tests -p 'test_alpha10g_path_audit.py'
          python3 -m unittest discover -s settings/tests -p 'test_alpha11a_screen_privacy.py'
          python3 -m unittest discover -s settings/tests -p 'test_alpha11bc_combined_contract.py'
          python3 -m unittest discover -s conversation/tests -p 'test_chat_views_integration.py'
          python3 -m unittest discover -s translation/tests -p 'test_integration.py'
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          javac -d "$classes" conversation/src/com/yooshastan/ultmessenger/conversation/UltChatView.java conversation/tests/UltChatViewTest.java
          java -cp "$classes" UltChatViewTest
          javac -d "$classes" settings/src/com/yooshastan/ultmessenger/settings/UltNetworkSourceMatrix.java settings/tests/UltNetworkSourceMatrixTest.java
          java -cp "$classes" UltNetworkSourceMatrixTest
          javac -d "$classes" translation/src/com/yooshastan/ultmessenger/translation/UltTranslationPolicy.java translation/tests/UltTranslationPolicyTest.java
          java -cp "$classes" UltTranslationPolicyTest

      - name: Alpha 0.13c discoverability contracts
        if: github.ref == 'refs/heads/feature/alpha13c-discoverability' || github.head_ref == 'feature/alpha13c-discoverability'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_alpha13c_discoverability.py'
          python3 -m unittest discover -s tests -p 'test_alpha13_contract.py'
          python3 -m unittest discover -s settings/tests -p 'test_integration.py'

      - name: Fast Alpha 0.13 native theme color and media-control contracts
        if: github.ref == 'refs/heads/feature/alpha13-custom-theme-media' || github.head_ref == 'feature/alpha13-custom-theme-media'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_alpha13_contract.py'
          python3 -m unittest discover -s appearance/tests -p 'test_integration.py'
          python3 -m unittest discover -s settings/tests -p 'test_integration.py'
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          javac -d "$classes" appearance/src/com/yooshastan/ultmessenger/appearance/UltAppearancePreset.java appearance/src/com/yooshastan/ultmessenger/appearance/UltCustomTheme.java appearance/tests/UltCustomThemeTest.java
          java -cp "$classes" UltCustomThemeTest

      - name: Fast Alpha 0.12c+d swipe navigator and media utilities
        if: github.ref == 'refs/heads/feature/alpha12cd-swipe-media-ux' || github.head_ref == 'feature/alpha12cd-swipe-media-ux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_alpha12cd_contract.py'
          python3 -m unittest discover -s chat/tests -p 'test_message_tools_integration.py'
          python3 -m unittest discover -s conversation/tests -p 'test_chat_views_integration.py'
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          javac -d "$classes" conversation/src/com/yooshastan/ultmessenger/conversation/UltChatView.java conversation/tests/UltChatViewTest.java
          java -cp "$classes" UltChatViewTest
          javac -d "$classes" chat/src/com/yooshastan/ultmessenger/chat/UltChatTools.java chat/tests/UltChatToolsTest.java
          java -cp "$classes" UltChatToolsTest

      - name: Fast Alpha 0.12a+b appearance and message contracts
        if: github.ref == 'refs/heads/feature/alpha12-nullgram-nekogram' || github.head_ref == 'feature/alpha12-nullgram-nekogram'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_alpha12_batch_contract.py'
          python3 -m unittest discover -s chat/tests -p 'test_message_tools_integration.py'
          python3 -m unittest discover -s conversation/tests -p 'test_chat_views_integration.py'
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          javac -d "$classes" conversation/src/com/yooshastan/ultmessenger/conversation/UltChatView.java conversation/tests/UltChatViewTest.java
          java -cp "$classes" UltChatViewTest
          javac -d "$classes" chat/src/com/yooshastan/ultmessenger/chat/UltChatTools.java chat/tests/UltChatToolsTest.java
          java -cp "$classes" UltChatToolsTest
